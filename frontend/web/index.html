<!DOCTYPE html>
<html>
<head>
  <!--
    如果 Web 应用部署在根路径以外，请修改下面的 href 值，使其反映应用的基础路径。

    下面提供的路径必须以斜杠 "/" 开头和结尾，才能正常工作。

    详情请参见：
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    这是 base href 的占位符，`flutter build` 提供的 `--base-href` 参数会替换它。
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Parlo AI 聊天应用">

  <!-- iOS meta 标签和图标。 -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="parlo">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon。 -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>parlo</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    可以自定义 "flutter_bootstrap.js" 脚本。
    这适用于为 Flutter loader 提供自定义配置，或在初始化过程中向用户提供反馈。

    详情请参见：
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
